name: MLOps Pipeline Verification Matrix

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

concurrency:
  group: mlops-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.8,<1"
      - run: |
          python -m compileall -q agents scripts src tests
          ruff check --select=E9,F agents scripts src tests

  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pandas scikit-learn snowflake-connector-python boto3 "PyYAML>=6,<7" pytest
      - run: pytest -q

  configuration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python -c "from agents.config import load_config; load_config('config/agent_config.yaml')"

  metric-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: |
          printf '%s' '[{"MetricName":"validation:roc_auc","Value":0.91}]' > final-metrics.json
          GITHUB_SHA="${{ github.sha }}" python -m scripts.record_metric_evidence --metrics-json final-metrics.json --job-name ci-fixture --output promotion-evidence.json
          python -c "import json; assert json.load(open('promotion-evidence.json'))['promotion_evidence']['promotable']"
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-evidence
          path: promotion-evidence.json
