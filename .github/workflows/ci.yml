name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "ruff>=0.8,<1"
      - run: |
          python -m compileall -q agents scripts tests
          ruff check agents scripts tests
          pytest -q
      - run: python -c "from agents.config import load_config; load_config('config/agent_config.yaml')"
