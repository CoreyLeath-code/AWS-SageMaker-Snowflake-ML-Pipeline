name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semantic version tag to publish"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release-artifacts:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate semantic release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null

      - name: Build source archive and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --output "dist/aws-sagemaker-snowflake-ml-pipeline-${RELEASE_TAG}.tar.gz" "$RELEASE_TAG"
          sha256sum "dist/aws-sagemaker-snowflake-ml-pipeline-${RELEASE_TAG}.tar.gz" > "dist/aws-sagemaker-snowflake-ml-pipeline-${RELEASE_TAG}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/aws-sagemaker-snowflake-ml-pipeline-${{ env.RELEASE_TAG }}.tar.gz
            dist/aws-sagemaker-snowflake-ml-pipeline-${{ env.RELEASE_TAG }}.sha256

  publish-image:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate semantic release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/coreyleath-code/aws-sagemaker-snowflake-ml-pipeline:${{ env.RELEASE_TAG }}
            ghcr.io/coreyleath-code/aws-sagemaker-snowflake-ml-pipeline:latest
