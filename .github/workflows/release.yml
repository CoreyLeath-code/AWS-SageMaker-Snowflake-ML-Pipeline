name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release-artifacts:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive and checksum
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output "dist/aws-sagemaker-snowflake-ml-pipeline-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum "dist/aws-sagemaker-snowflake-ml-pipeline-${GITHUB_REF_NAME}.tar.gz" > "dist/aws-sagemaker-snowflake-ml-pipeline-${GITHUB_REF_NAME}.sha256"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/aws-sagemaker-snowflake-ml-pipeline-${{ github.ref_name }}.tar.gz
            dist/aws-sagemaker-snowflake-ml-pipeline-${{ github.ref_name }}.sha256

  publish-image:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/coreyleath-code/aws-sagemaker-snowflake-ml-pipeline:${{ github.ref_name }}
            ghcr.io/coreyleath-code/aws-sagemaker-snowflake-ml-pipeline:latest
